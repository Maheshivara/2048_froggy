services:
  2048-builder:
    build:
      dockerfile: docker/Dockerfile
      context: .
    env_file:
      - .env
    environment:
      CGO: "1"
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: mipsle
      GOMIPS: hardfloat
      CC: /usr/local/bin/mips-gcc
      CGO_CFLAGS: "-O2"
      CGO_LDFLAGS: ""
    volumes:
      - ./out:/2048/out
    user: "${MY_UID}:${MY_GID}"
    command: ["go", "build", "-o", "/2048/out/2048", "."]
